<mat-card class="task-form-card">
  <h3>{{ isRescheduleMode() ? 'Reschedule Task' : 'Add New Task' }}</h3>
  <div class="task-date" *ngIf="getSelectedDate()">{{ getSelectedDate() | date:'EEEE, MMMM d, yyyy' }}</div>

  <mat-form-field appearance="outline" style="width:100%">
    <mat-label>Task Title</mat-label>
    <input matInput [(ngModel)]="newTaskTitle" placeholder="Enter task title">
  </mat-form-field>

  <mat-form-field appearance="outline" style="width:100%">
    <mat-label>Description</mat-label>
    <textarea matInput [(ngModel)]="newTaskDescription" placeholder="Enter task description" rows="3"></textarea>
  </mat-form-field>

  <div class="form-row">
    <mat-form-field appearance="outline" style="flex:1">
      <mat-label>Priority</mat-label>
      <mat-select [(ngModel)]="newTaskPriority">
        <mat-option [value]="0">Low</mat-option>
        <mat-option [value]="1">Medium</mat-option>
        <mat-option [value]="2">High</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" style="flex:1">
      <mat-label>Status</mat-label>
      <mat-select [(ngModel)]="newTaskStatus">
        <mat-option *ngFor="let option of taskStatusOptions" [value]="option.value">
          {{ option.label }}
        </mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <div class="form-row">
    <mat-form-field appearance="outline" style="flex:1">
      <mat-label>Start Date</mat-label>
      <input matInput [matDatepicker]="startDatePicker" [(ngModel)]="newTaskStartDateObj">
      <mat-datepicker-toggle matIconSuffix [for]="startDatePicker"></mat-datepicker-toggle>
      <mat-datepicker #startDatePicker></mat-datepicker>
    </mat-form-field>

    <mat-form-field appearance="outline" style="flex:1">
      <mat-label>End Date</mat-label>
      <input matInput [matDatepicker]="endDatePicker" [(ngModel)]="newTaskEndDateObj">
      <mat-datepicker-toggle matIconSuffix [for]="endDatePicker"></mat-datepicker-toggle>
      <mat-datepicker #endDatePicker></mat-datepicker>
    </mat-form-field>

    <mat-form-field appearance="outline" style="flex:1">
      <mat-label>Category</mat-label>
      <mat-select [(ngModel)]="newTaskCategory">
        <mat-option *ngFor="let cat of getCategories()" [value]="cat.id">
          <span *ngIf="cat.id !== 'all'" class="dot" [style.background]="cat.color"></span> {{cat.name}}
        </mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <!-- SCHEDULING FIELDS -->
  <div class="form-row" style="align-items: center; margin-bottom: 16px;">
    <label style="flex: 1; display: flex; align-items: center; gap: 8px; cursor: pointer;">
      <input type="checkbox" [(ngModel)]="hasTime" style="width: 18px; height: 18px; cursor: pointer;">
      <span style="font-size: 14px; color: #555;">Add specific time</span>
    </label>
  </div>

  <!-- TIME AND DURATION FIELDS (only show if hasTime is true) -->
  <div class="form-row" *ngIf="hasTime">
    <mat-form-field appearance="outline" style="flex:1">
      <mat-label>Start Time</mat-label>
      <input matInput [(ngModel)]="newTaskStartTime" readonly>
      <button mat-icon-button matIconSuffix (click)="openTimePicker()" type="button">
        <mat-icon>schedule</mat-icon>
      </button>
    </mat-form-field>

    <mat-form-field appearance="outline" style="flex:1">
      <mat-label>Duration (minutes)</mat-label>
      <input matInput type="number" [(ngModel)]="newTaskDuration" placeholder="60" min="1" max="480">
    </mat-form-field>
  </div>

  <div class="form-actions">
    <button mat-button class="save-btn" (click)="onSave()">Save Task</button>
    <button mat-button (click)="onCancel()">Cancel</button>
  </div>
</mat-card>
