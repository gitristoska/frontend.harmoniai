<div class="calendar-container">
  <div class="top-controls">
    <div class="control-group">
      <div class="date-navigation">
        <button mat-icon-button (click)="previousDay()" title="Previous">
          <mat-icon>chevron_left</mat-icon>
        </button>
        <span class="date-label">{{ navigationLabel() }}</span>
        <button mat-icon-button (click)="nextDay()" title="Next">
          <mat-icon>chevron_right</mat-icon>
        </button>
        <button mat-icon-button (click)="goToToday()" title="Today">
          <mat-icon>today</mat-icon>
        </button>
      </div>

      <app-category-selector 
        [selectedCategory]="selectedCategory()" 
        [categories]="categories"
        (categoryChange)="selectCategory($event)">
      </app-category-selector>

      <app-add-task-button 
        (addTaskClick)="onAddTaskClick()">
      </app-add-task-button>
    </div>
  </div>

  <!-- ADD TASK FORM MODAL -->
  <div class="modal-overlay" *ngIf="showAddTaskForm()" (click)="onAddTaskClick()">
    <app-add-task-form 
      [categories]="categories"
      [selectedDate]="selectedDate()"
      (click)="$event.stopPropagation()"
      (taskSave)="onTaskAdded($event)"
      (taskCancel)="onAddTaskClick()">
    </app-add-task-form>
  </div>

  <div class="main-content">
    <!-- DAILY VIEW -->
    <div class="calendar-column">
      <app-calendar-daily
        [selectedDate]="selectedDate()"
        [events]="dailyEvents(selectedDate())"
        [categories]="categories"
        [startHour]="startHour"
        [endHour]="endHour"
        (eventClick)="onEventClick($event)">
      </app-calendar-daily>
      
      <!-- DAILY REFLECTION -->
      <app-daily-reflection
        [selectedDate]="selectedDate()">
      </app-daily-reflection>
    </div>
  </div>
